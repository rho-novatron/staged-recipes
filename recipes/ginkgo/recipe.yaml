context:
  version: "1.11.0"
  build_base: 0
  # CUDA builds get +200 so the solver prefers them on GPU-capable machines
  cuda_offset: ${{ 200 if cuda_compiler_version != 'None' else 0 }}
  build: ${{ build_base + cuda_offset if mpi != 'nompi' else build_base + cuda_offset + 100 }}
  # Build string encodes MPI and CUDA variants
  mpi_prefix: ${{ 'mpi_' + mpi if mpi != 'nompi' else 'nompi' }}
  cuda_infix: ${{ '_cuda' + (cuda_compiler_version | replace('.', '')) if cuda_compiler_version != 'None' else '' }}

package:
  name: ginkgo
  version: ${{ version }}

source:
  url: https://github.com/ginkgo-project/ginkgo/archive/v${{ version }}.tar.gz
  sha256: 8052c3d5994e1c996ebabe50a169deb565965da4f1c6c02e814ff0c7146c0378

build:
  number: ${{ build }}
  string: ${{ mpi_prefix }}${{ cuda_infix }}_h${{ hash }}_${{ build }}
  # MPI variants only on Unix (conda-forge convention)
  skip:
    - win and mpi != 'nompi'
  dynamic_linking:
    missing_dso_allowlist:
      - if: win
        then: "*/nvcuda.dll"
requirements:
  build:
    - cmake >=3.16
    - ninja
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - if: cuda_compiler_version != "None"
      then:
        - ${{ compiler('cuda') }}
        - cuda-cccl
        - cuda-nvtx-dev
  host:
    - if: mpi != 'nompi'
      then: ${{ mpi }}
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
    - if: cuda_compiler_version != "None"
      then:
        - cuda-version ${{ cuda_compiler_version }}.*
        - cuda-cudart-dev
        - cuda-nvtx-dev
        - libcublas-dev
        - libcufft-dev
        - libcurand-dev
        - libcusparse-dev
  run:
    - if: mpi != 'nompi'
      then: ${{ mpi }}
    - if: cuda_compiler_version != "None"
      then: __cuda
  run_exports:
    - ${{ pin_subpackage('ginkgo', upper_bound='x.x') }}
    - if: mpi != 'nompi'
      then: ginkgo * ${{ mpi_prefix }}${{ cuda_infix }}_*

tests:
  - script:
      - if: unix
        then:
          - test -f ${PREFIX}/include/ginkgo/ginkgo.hpp
          - test -e ${PREFIX}/lib/libginkgo${SHLIB_EXT}
          - test -e ${PREFIX}/lib/libginkgo_reference${SHLIB_EXT}
          - test -e ${PREFIX}/lib/libginkgo_omp${SHLIB_EXT}
        else:
          - if not exist %LIBRARY_PREFIX%\include\ginkgo\ginkgo.hpp (exit 1)
          - if not exist %LIBRARY_PREFIX%\lib\ginkgo.lib (exit 1)

about:
  homepage: https://ginkgo-project.github.io/
  summary: High-performance numerical linear algebra library for many-core systems
  description: |
    Ginkgo is a high-performance numerical linear algebra library for many-core
    systems, with a focus on solution of sparse linear systems. It is implemented
    using modern C++ (C++17), with GPU kernels implemented for NVIDIA, AMD and
    Intel GPUs.
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://ginkgo-project.github.io/ginkgo-generated-documentation/doc/develop/
  repository: https://github.com/ginkgo-project/ginkgo

extra:
  recipe-maintainers:
    - rho-novatron
